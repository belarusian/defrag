name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

      - name: Check code formatting
        run: |
          pip install black ruff
          black --check defrag tests examples
          # Ruff checks disabled due to CI config resolution issues
          # TODO: Fix ruff.toml/pyproject.toml integration on CI
