[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "defrag"
version = "0.1.0"
description = "LLM-powered documentation validation: semantic understanding + physical link grounding"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Kode-S"}
]
keywords = ["documentation", "validation", "llm", "semantic-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Documentation",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "PyYAML>=6.0",
    "anthropic>=0.18.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
defrag = "defrag.cli:main"

[project.urls]
Homepage = "https://github.com/kode-s/defrag"
Repository = "https://github.com/kode-s/defrag"
Issues = "https://github.com/kode-s/defrag/issues"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py38"

# Disable rules that require newer Python syntax or break CI
# SIM117: nested with statements (requires Python 3.9+)
# I001: import sorting (causes issues with newer ruff versions)
# SIM105: use implicit boolean comparison (conflicts with style)
# PLC0415: import inside function (allowed in tests for mocking)
# UP024: Replace aliased errors with `OSError`
extend-ignore = ["SIM117", "I001", "SIM105", "PLC0415", "UP024"]
